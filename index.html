<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Wu // Workbench</title>

    <!-- Niche Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --muted: #555555;
            --border: #000000;
            --hover-bg: #000000;
            --hover-fg: #ffffff;
            --paper: #f9f7f5; /* Faint paper tint for content area */
            --subtle-bg: #f4f4f4;
            --subtle-border: #e0e0e0;
            --subtle-bg-2: #f0f0f0;
            --error-bg: #fff0f0;
            --error-text: red;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg: #0a0a0a;
            --fg: #ffffff;
            --muted: #aaaaaa;
            --border: #ffffff;
            --hover-bg: #ffffff;
            --hover-fg: #000000;
            --paper: #111111;
            --subtle-bg: #1a1a1a;
            --subtle-border: #333333;
            --subtle-bg-2: #1a1a1a;
            --error-bg: #2a0000;
            --error-text: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* STRICT: No rounded corners */
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Spectral', serif;
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* --- LAYOUT --- */
        .sidebar {
            width: 320px;
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--bg);
            z-index: 10;
            transition: background 0.2s ease, border 0.2s ease;
        }

        /* New wrapper to hold the main area, crosshairs, and toggle */
        .main-wrapper {
            flex-grow: 1;
            position: relative;
            background: var(--bg);
            overflow: hidden; /* Prevents crosshairs from causing page scroll */
            transition: background 0.2s ease;
        }

        .main {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            position: relative;
            background: var(--bg);
            transition: background 0.2s ease;
        }

        /* Crosshair decorations for the drafting aesthetic */
        .crosshair {
            position: absolute; /* Absolute relative to .main-wrapper */
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 10; /* Keeps them above the scrolling text */
            transition: background 0.2s ease;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: var(--fg);
        }
        .crosshair::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .crosshair::after { width: 1px; height: 100%; left: 50%; top: 0; }
        .ch-tl { top: 24px; left: 24px; }
        .ch-tr { top: 24px; right: 24px; }
        .ch-bl { bottom: 24px; left: 24px; }
        .ch-br { bottom: 24px; right: 24px; }

        /* Dark Mode Toggle */
        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 56px; /* Offset so it doesn't overlap the crosshair */
            z-index: 20;
            padding: 8px 12px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: background 0.1s, color 0.1s, border 0.2s;
        }
        .theme-toggle:hover {
            background: var(--fg);
            color: var(--bg);
        }

        /* --- SIDEBAR --- */
        .sidebar-header {
            padding: 32px 24px;
            border-bottom: 2px solid var(--border);
            transition: border 0.2s ease;
        }

        .sidebar-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .sidebar-header .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            border-bottom: 1px solid var(--subtle-border);
            transition: border 0.2s ease;
        }

        .nav-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            text-decoration: none;
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 1.25rem;
            transition: background 0.1s ease-out, color 0.1s ease-out, padding 0.1s ease-out;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--hover-bg);
            color: var(--hover-fg);
            padding-left: 32px; /* Shift right on hover */
        }

        /* Flicker only when hovered, for 3 cycles */
        .nav-link:hover {
            animation: nav-flicker 0.16s step-end 2;
        }

        .nav-link span {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .sidebar-footer {
            padding: 24px;
            border-top: 2px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            line-height: 1.8;
            text-transform: uppercase;
            transition: border 0.2s ease, color 0.2s ease;
        }

        /* --- MAIN CONTENT --- */
        .content-container {
            padding: 64px 48px;
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            min-height: 100%;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 48px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            letter-spacing: -0.02em;
            transition: border 0.2s ease;
        }

        .section-title .meta {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* --- MODULES (Projects) --- */
        .module {
            border: 2px solid var(--border);
            margin-bottom: 32px;
            transition: transform 0.15s, box-shadow 0.15s, border 0.2s, background 0.2s;
            background: var(--bg);
        }

        .module:hover {
            box-shadow: 6px 6px 0 var(--border); /* Hard offset shadow */
            transform: translate(-2px, -2px);
        }

        .module-header {
            padding: 16px 24px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--subtle-bg);
            transition: border 0.2s ease, background 0.2s ease;
        }

        .module-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .module-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            border: 1px solid var(--border);
            padding: 4px 8px;
            text-transform: uppercase;
            background: var(--bg);
            transition: border 0.2s, background 0.2s;
        }

        .module-body {
            padding: 32px;
            font-family: 'Spectral', serif;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--fg);
            opacity: 0.9;
        }

        .module-link {
            display: block;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            text-decoration: none;
            color: var(--fg);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: background 0.1s, color 0.1s;
        }

        .module-link:hover {
            background: var(--fg);
            color: var(--bg);
        }

        /* --- LOG (Blog) --- */
        .log-entry {
            border: 2px solid var(--border);
            margin-bottom: 48px;
            position: relative;
            transition: border 0.2s ease;
        }

        .log-header {
            padding: 16px 24px;
            border-bottom: 2px solid var(--border);
            background: var(--fg);
            color: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, border 0.2s, color 0.2s;
        }

        .log-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .log-date {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }

        .log-content {
            padding: 32px;
            font-family: 'Spectral', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            word-wrap: break-word;
            min-height: 150px;
        }

        /* Markdown Generated Elements Styling */
        .log-content h1, .log-content h2, .log-content h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 24px;
            line-height: 1.2;
        }
        .log-content h1 { font-size: 2rem; }
        .log-content h2 { font-size: 1.5rem; }
        .log-content h3 { font-size: 1.25rem; }
        .log-content p { margin-bottom: 16px; }
        .log-content ul, .log-content ol { margin-bottom: 16px; padding-left: 24px; }
        .log-content li { margin-bottom: 8px; }
        .log-content a { color: var(--fg); text-decoration: underline; }
        .log-content code { font-family: 'Space Mono', monospace; background: var(--subtle-bg-2); padding: 2px 4px; border: 1px solid var(--border); font-size: 0.9rem; }
        .log-content pre { background: var(--subtle-bg); border: 1px solid var(--border); padding: 16px; overflow-x: auto; margin-bottom: 16px; }
        .log-content pre code { border: none; padding: 0; background: none; }
        .log-content blockquote { border-left: 4px solid var(--border); padding-left: 16px; margin: 16px 0; color: var(--muted); font-style: italic; }

        /* Typewriter Cursor */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            font-weight: normal;
            display: inline-block;
        }

        /* --- ADMIN --- */
        .admin-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            outline: none;
            background: var(--bg);
            color: var(--fg);
            transition: border 0.2s, background 0.2s;
        }

        .admin-panel input:focus, .admin-panel textarea:focus {
            background: var(--subtle-bg-2);
            box-shadow: 4px 4px 0 var(--border);
        }

        .admin-panel button {
            padding: 16px 32px;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s;
            align-self: flex-start;
        }

        .admin-panel button:hover {
            background: var(--fg);
            color: var(--bg);
            box-shadow: 4px 4px 0 var(--border);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes nav-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.86; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px solid var(--border);
                position: relative;
                z-index: 20;
            }
            .nav-list {
                display: flex;
                overflow-x: auto;
                border-bottom: 1px solid var(--subtle-border);
            }
            .nav-item {
                border-bottom: none;
                border-right: 1px solid var(--subtle-border);
                flex-shrink: 0;
            }
            .nav-link {
                padding: 16px;
                font-size: 1rem;
            }
            .nav-link:hover, .nav-link.active {
                padding-left: 16px;
            }
            .main-wrapper {
                width: 100%;
                height: calc(100vh - 160px); /* Adjust based on sidebar height */
            }
            .content-container {
                padding: 32px 24px;
            }
            .section-title {
                font-size: 1.8rem;
            }
            .crosshair { display: none; }
            .theme-toggle { 
                top: 14px; 
                right: 16px; 
                z-index: 30;
            }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Andrew Wu</h1>
            <div class="subtitle">call sign: Gochan_562</div>
        </div>
        <ul class="nav-list" id="navList">
            <li class="nav-item">
                <a href="#home" class="nav-link" data-route="home">HOME</a>
            </li>
            <li class="nav-item">
                <a href="#projects" class="nav-link" data-route="projects">PROJECTS</a>
            </li>
            <li class="nav-item">
                <a href="#research" class="nav-link" data-route="research">RESEARCH</a>
            </li>
            <li class="nav-item">
                <a href="#blog" class="nav-link" data-route="blog">BLOG</a>
            </li>
        </ul>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="main-wrapper">
        <!-- Crosshairs are now outside the scrolling main area -->
        <div class="crosshair ch-tl"></div>
        <div class="crosshair ch-tr"></div>
        <div class="crosshair ch-bl"></div>
        <div class="crosshair ch-br"></div>

        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="theme-toggle">DARK</button>

        <main class="main">
            <div class="content-container" id="app">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <script>
        // Configure marked (Markdown parser)
        marked.setOptions({
            gfm: true, // GitHub Flavored Markdown
            breaks: true // Convert \n to <br>
        });

        // --- STATE & ROUTING ---
        const app = document.getElementById('app');

        const routes = {
            home: renderHome,
            projects: renderProjects,
            research: renderResearch,
            blog: renderBlog,
            admin: renderAdmin
        };

        function router() {
            const hash = window.location.hash.substring(1) || 'home';
            const routeFunction = routes[hash] || routes.home;

            // Update active nav
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.route === hash) {
                    link.classList.add('active');
                }
            });

            // Render
            routeFunction();

            // Scroll to top on route change
            document.querySelector('.main').scrollTop = 0;
        }

        window.addEventListener('hashchange', router);

        // --- VIEWS ---

        function renderHome() {
            app.innerHTML = `
                <div class="section-title">
                    <span>Home</span>
                </div>
                <div style="font-family: 'Spectral', serif; font-size: 1.3rem; line-height: 1.7; max-width: 600px;">
                    <p style="margin-bottom: 24px;">Yo guys this is my website. I tried to make it lowkey cool.</p>
                    <p style="margin-bottom: 24px;">I like building experimental stuffs and actually useful tools that are not just AI slop. I also make video games. Search "gochan562" on google to see my itch.io profile (only 1 game now tho)</p>
                    <p style="margin-bottom: 24px;">Use the modules on the left to navigate.</p>
                </div>
                <div style="margin-top: 64px; border-top: 2px solid var(--border); padding-top: 24px;">
                    <p style="font-family: 'Space Mono', monospace; font-size: 0.9rem; margin-bottom: 16px; text-transform: uppercase;">Subsystems:</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-family: 'Space Mono', monospace; font-size: 0.9rem;">
                        <div style="border: 1px solid var(--subtle-border); padding: 16px;">CODING<br><span style="color: var(--muted); font-size:0.8rem;">TS / JS / PY</span></div>
                        <div style="border: 1px solid var(--subtle-border); padding: 16px;">PIANO<br><span style="color: var(--muted); font-size:0.8rem;">GRADE 8 ABRSM</span></div>
                        <div style="border: 1px solid var(--subtle-border); padding: 16px;">CALLIGRAPHY<br><span style="color: var(--muted); font-size:0.8rem;">JAPANESE</span></div>
                        <div style="border: 1px solid var(--subtle-border); padding: 16px;">LANGUAGES<br><span style="color: var(--muted); font-size:0.8rem;">ENGLISH</span></div>
                    </div>
                </div>
            `;
        }

        function renderProjects() {
            app.innerHTML = `
                <div class="section-title">
                    <span>Projects</span>
                </div>

                <div class="module">
                    <div class="module-header">
                        <span class="module-title">Claro.AI</span>
                        <span class="module-tag">AI / WORKBENCH</span>
                    </div>
                    <div class="module-body">
                        A browser-based AI workbench for discovering Hugging Face models, building notebooks, running inference, and fine-tuning models without wiring together every piece of ML infrastructure by hand.
                    </div>
                    <a href="https://github.com/gochan562/Claro.AI" target="_blank" class="module-link">VIEW SOURCE -></a>
                </div>

                <div class="module">
                    <div class="module-header">
                        <span class="module-title">Shape Computer</span>
                        <span class="module-tag">EMULATOR / VISUAL</span>
                    </div>
                    <div class="module-body">
                        A computer emulator completely made out of 2D shape nodes. An experiment in reducing computation to its most visual, geometric primitives.
                    </div>
                    <a href="https://github.com/gochan562/Shape-Computer" target="_blank" class="module-link">VIEW SOURCE -></a>
                </div>

                <div class="module">
                    <div class="module-header">
                        <span class="module-title">Sonic Canvas</span>
                        <span class="module-tag">AUDIO / VISUAL</span>
                    </div>
                    <div class="module-body">
                        Turns a music file into an animated visual that reacts while the track plays. Features multiple scenes: Liquid, Orbit, Tunnel, Grid, and Particle Field. Exports to WebM.
                    </div>
                    <a href="https://github.com/gochan562/SonicCanvas" target="_blank" class="module-link">VIEW SOURCE -></a>
                </div>

                <div class="module">
                    <div class="module-header">
                        <span class="module-title">Mandelbrot Explorer</span>
                        <span class="module-tag">FRACTAL / MATH</span>
                    </div>
                    <div class="module-body">
                        A simple Mandelbrot / Julia fractal explorer. An exercise in infinite complexity rendered in finite pixels.
                    </div>
                    <a href="https://github.com/gochan562/fractal" target="_blank" class="module-link">VIEW SOURCE -></a>
                </div>
            `;
        }

        function renderResearch() {
            app.innerHTML = `
                <div class="section-title">
                    <span>Research</span>
                </div>
                <div style="border: 2px solid var(--border); padding: 32px; background: var(--paper);">
                    <p style="font-family: 'Spectral', serif; font-size: 1.2rem; margin-bottom: 16px; font-weight: 600;">
                        Question: Among pregnant women receiving maternal healthcare in Bangladesh, can survey-based proxies achieve comparable predictive value to clinical vitals for maternal risk stratification?
                    </p>
                    <p style="font-family: 'Spectral', serif; font-size: 1rem; color: var(--muted); font-style: italic;">
                        A comparison between UCI Maternal Health Risk dataset and BDHS 2022 dataset.
                    </p>
                </div>
                <div style="margin-top: 48px;">
                    <p style="font-family: 'Space Mono', monospace; font-size: 0.9rem; margin-bottom: 16px; text-transform: uppercase;">Experience Log:</p>
                    <ul style="list-style: none; font-family: 'Spectral', serif; font-size: 1.1rem;">
                        <li style="border-bottom: 1px solid var(--subtle-border); padding: 12px 0; display: flex; justify-content: space-between;"><span>Tokyo Open Data Hackathon</span> <span style="font-family:'Space Mono'; font-size:0.8rem; color: var(--muted);">PARTICIPANT</span></li>
                        <li style="border-bottom: 1px solid var(--subtle-border); padding: 12px 0; display: flex; justify-content: space-between;"><span>Hack Club YSWS "Crescent"</span> <span style="font-family:'Space Mono'; font-size:0.8rem; color: var(--muted);">REVIEWER</span></li>
                        <li style="padding: 12px 0; display: flex; justify-content: space-between;"><span>Claro.AI</span> <span style="font-family:'Space Mono'; font-size:0.8rem; color: var(--muted);">PROJECT LEAD</span></li>
                    </ul>
                </div>
            `;
        }

        // --- BLOG VIEW (Updated to fetch from GitHub) ---
        async function renderBlog() {
            let posts = [];
            app.innerHTML = `
                <div class="section-title">
                    <span>Log Entries</span>
                </div>
                <div id="postList">
                    <p style="font-family: 'Spectral', serif; font-size: 1.2rem; color: var(--muted);">FETCHING TRANSMISSIONS...</p>
                </div>
            `;
            
            try {
                // We add ?t=timestamp to bust the browser cache so it always gets the latest from GitHub
                const response = await fetch('posts.json?t=' + Date.now());
                if (response.ok) {
                    posts = await response.json();
                } else {
                    throw new Error('File not found');
                }
            } catch (e) {
                // Fallback to localStorage if testing locally without the json file
                console.log("Fetch failed, falling back to local storage. Error: ", e);
                posts = JSON.parse(localStorage.getItem('andrew_blog_posts') || '[]');
            }

            let html = `
                <div class="section-title">
                    <span>Log Entries</span>
                </div>
                <div id="postList">
            `;

            if (posts.length === 0) {
                html += `<p style="font-family: 'Spectral', serif; font-size: 1.2rem; color: var(--muted);">No transmissions yet. Check back later.</p>`;
            } else {
                posts.forEach((post, index) => {
                    html += `
                        <div class="log-entry">
                            <div class="log-header">
                                <h3>${escapeHtml(post.title)}</h3>
                                <span class="log-date">${post.date}</span>
                            </div>
                            <div class="log-content" id="post-${index}" data-content="${escapeHtml(post.content)}"></div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            app.innerHTML = html;

            // Initiate typing effect for the first post
            if (posts.length > 0) {
                typeOutPost(document.getElementById('post-0'));
            }
        }

        function typeOutPost(element) {
            const content = unescapeHtml(element.dataset.content);
            element.innerHTML = ''; 

            let i = 0;
            const speed = 15; // ms per char

            function type() {
                if (i < content.length) {
                    let currentText = content.substring(0, i + 1);
                    
                    // Parse the accumulated text as Markdown, and append a cursor span
                    // We wrap it in a div to ensure block elements render correctly
                    element.innerHTML = `<div class="typing-cursor">${marked.parse(currentText)}</div>`;
                    
                    i++;

                    // Scroll the main area if content overflows while typing
                    const main = document.querySelector('.main');
                    main.scrollTop = main.scrollHeight;
                    setTimeout(type, speed);
                } else {
                    // Final render without cursor
                    element.innerHTML = marked.parse(content);
                }
            }
            type();
        }

        // --- ADMIN VIEW (Updated to generate JSON for GitHub) ---
        function renderAdmin() {
            app.innerHTML = `
                <div class="section-title">
                    <span>Author Entry</span>
                    <span class="meta">WRITE_MODE</span>
                </div>
                <div class="admin-panel">
                    <div>
                        <label style="font-family: 'Space Mono', monospace; font-size: 0.8rem; text-transform: uppercase; display:block; margin-bottom: 8px;">Title</label>
                        <input type="text" id="postTitle" placeholder="Enter title...">
                    </div>
                    <div>
                        <label style="font-family: 'Space Mono', monospace; font-size: 0.8rem; text-transform: uppercase; display:block; margin-bottom: 8px;">Content (Markdown Supported)</label>
                        <textarea id="postContent" rows="15" placeholder="Type your log entry here...

# Markdown is supported!
**Bold**, *italics*, [links](https://google.com), 
- lists
- items

\`\`\`
code blocks
\`\`\`"></textarea>
                    </div>
                    <button id="generateJsonBtn">GENERATE JSON SNIPPET</button>
                    
                    <div id="jsonOutputContainer" style="display:none; margin-top: 24px;">
                        <label style="font-family: 'Space Mono', monospace; font-size: 0.8rem; text-transform: uppercase; display:block; margin-bottom: 8px;">Copy this to posts.json:</label>
                        <textarea id="jsonOutput" rows="8" style="background: var(--subtle-bg-2);" readonly></textarea>
                        <p style="font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--muted); margin-top: 8px;">> INSTRUCTIONS: Copy the above text. Open posts.json in your GitHub repo, paste this inside the brackets [ ], and commit. Separate multiple posts with a comma.</p>
                    </div>
                </div>
            `;

            document.getElementById('generateJsonBtn').addEventListener('click', () => {
                const title = document.getElementById('postTitle').value;
                const content = document.getElementById('postContent").value;

                if (!title || !content) {
                    alert('ERROR: Fields cannot be empty.');
                    return;
                }

                const newPost = {
                    title: title,
                    content: content,
                    date: new Date().toISOString().split('T')[0]
                };

                // Output as formatted JSON string
                const jsonString = JSON.stringify(newPost, null, 4);
                
                document.getElementById('jsonOutput').value = jsonString;
                document.getElementById('jsonOutputContainer').style.display = 'block';
            });
        }

        // --- UTILITIES ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function unescapeHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent || '';
        }

        // --- DARK MODE LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        
        // Apply saved theme on load
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.innerText = 'LIGHT';
        } else {
            themeToggle.innerText = 'DARK';
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.innerText = 'DARK';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.innerText = 'LIGHT';
            }
        });

        // --- INIT ---
        // Secret key sequence to access admin: "admin"
        let keyBuffer = '';
        document.addEventListener('keydown', (e) => {
            // Ignore keypresses if typing in an input field
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            keyBuffer += e.key.toLowerCase();
            if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);

            if (keyBuffer.endsWith('admin')) {
                window.location.hash = 'admin';
                keyBuffer = '';
            }
        });

        // Initial render
        router();
    </script>
</body>
</html>
